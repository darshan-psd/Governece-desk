# Alembic configuration for the Governance Desk database.
#
#   .venv/bin/alembic upgrade head                 # database from settings (GOVERNANCE_DATA_DIR)
#   .venv/bin/alembic -x db=/path/to/copy.sqlite upgrade head
#   .venv/bin/alembic current | history | heads
#
# The database URL is never stored here: env.py derives it from the application settings.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
