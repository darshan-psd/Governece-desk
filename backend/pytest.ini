[pytest]
testpaths = tests
markers =
    sqlite_only: exercises SQLite-specific behaviour (file adoption, query plans); skipped when the suite runs on PostgreSQL
    postgres: needs a PostgreSQL server (GOVERNANCE_TEST_POSTGRES_URL or local binaries); skipped when none is available
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore:Using `httpx` with `starlette.testclient` is deprecated
